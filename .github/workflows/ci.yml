name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # A short run, so CI proves the benchmark still executes and that the
      # scenarios still agree on the output — not that the numbers hold up on
      # shared runner hardware.
      - run: npm run bench:quick
